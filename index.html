<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md. Rabby Hasan — The Lab Notebook</title>
    <meta
      name="description"
      content="Exploring Machine Learning, Deep Learning, and Generative AI while developing practical software solutions and research-driven projects."
    />
    <meta name="theme-color" content="#08090A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set the theme before first paint to avoid a flash. Dark is the launch theme;
         light is used only when the visitor has chosen it. Keep the storage key in
         sync with src/theme/constants.js. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('lab-notebook-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    <!-- Inter (primary) + JetBrains Mono (technical). Georgia is a system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
