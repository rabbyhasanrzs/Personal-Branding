<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md. Rabby Hasan — The Lab Notebook</title>
    <meta
      name="description"
      content="Exploring Machine Learning, Deep Learning, and Generative AI while developing practical software solutions and research-driven projects."
    />
    <meta name="theme-color" content="#08090A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Twitter Card: how the site looks when the link is shared.
         og:image is root-relative, so scrapers resolve it against the deployed
         domain — update it to an absolute URL if the portrait file is renamed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Lab Notebook" />
    <meta property="og:title" content="Md. Rabby Hasan — The Lab Notebook" />
    <meta
      property="og:description"
      content="Aspiring AI/ML Engineer exploring machine learning, deep learning, generative AI, and practical software engineering through research, experimentation, and project development."
    />
    <meta property="og:image" content="/Professional%20Navy%20Suit%20Portrait.png" />
    <meta property="og:image:alt" content="Portrait of Md. Rabby Hasan" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Md. Rabby Hasan — The Lab Notebook" />
    <meta
      name="twitter:description"
      content="Aspiring AI/ML Engineer exploring machine learning, deep learning, generative AI, and practical software engineering through research, experimentation, and project development."
    />
    <meta name="twitter:image" content="/Professional%20Navy%20Suit%20Portrait.png" />
    <meta name="twitter:image:alt" content="Portrait of Md. Rabby Hasan" />

    <!-- Set the theme before first paint to avoid a flash. Dark is the launch theme;
         light is used only when the visitor has chosen it. Keep the storage key in
         sync with src/theme/constants.js. -->
    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('lab-notebook-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    <!-- Inter (primary) + JetBrains Mono (technical). Georgia is a system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
